<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Practice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <h2>TechStore</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Featured Products</h1>

    <section class="products">

      <article class="card">
        <img src="https://placehold.co/200x150?text=PRODUCT1&font=lora" alt="Product">
        <h3>Wireless Headphones</h3>
        <p>$49.99</p>
        <button>Add to Cart</button>
      </article>

      <article class="card">
        <img src="https://placehold.co/200x150?text=PRODUCT2&font=lora" alt="Product">
        <h3>Mechanical Keyboard</h3>
        <p>$79.99</p>
        <button>Add to Cart</button>
      </article>

      <article class="card">
        <img src="https://placehold.co/200x150?text=PRODUCT3&font=lora" alt="Product">
        <h3>Gaming Mouse</h3>
        <p>$29.99</p>
        <button>Add to Cart</button>
      </article>

      <article class="card">
        <img src="https://placehold.co/200x150?text=PRODUCT4&font=lora" alt="Product">
        <h3>Smart Watch</h3>
        <p>$99.99</p>
        <button>Add to Cart</button>
      </article>

      <article class="card">
        <img src="https://placehold.co/200x150?text=PRODUCT5&font=lora" alt="Product">
        <h3>USB Microphone</h3>
        <p>$59.99</p>
        <button>Add to Cart</button>
      </article>

      <article class="card">
        <img src="https://placehold.co/200x150?text=PRODUCT6&font=lora" alt="Product">
        <h3>Gaming Monitor</h3>
        <p>$199.99</p>
        <button>Add to Cart</button>
      </article>

    </section>
  </main>

</body>
</html>
